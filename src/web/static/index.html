<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20260829e" />
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4" y="5" width="16" height="14" rx="4" stroke="url(#g)" stroke-width="1.8"/>
            <circle cx="9" cy="11" r="1.3" fill="url(#g)"/>
            <circle cx="15" cy="11" r="1.3" fill="url(#g)"/>
            <path d="M9 15h6" stroke="url(#g)" stroke-width="1.6" stroke-linecap="round"/>
            <defs>
              <linearGradient id="g" x1="4" y1="5" x2="20" y2="19">
                <stop stop-color="#7B5CFF"/><stop offset="1" stop-color="#FF6BCB"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="brand-name">CodeAgent</span>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="historySearch" type="search" placeholder="Search chats" />
      </label>

      <nav class="nav">
        <button class="nav-item active" data-view="home" type="button">
          <span class="nav-icon">✦</span> Explore
        </button>
        <button class="nav-item" id="btnNew" type="button">
          <span class="nav-icon">＋</span> New task
        </button>
        <button class="nav-item" id="btnResetDemos" type="button">
          <span class="nav-icon">↺</span> Reset demos
        </button>
        <a class="nav-item" href="https://github.com/hyj321/coding-agent" target="_blank" rel="noreferrer">
          <span class="nav-icon">⧉</span> GitHub
        </a>
        <button class="nav-item" id="btnRefreshHistory" type="button">
          <span class="nav-icon">↻</span> History
        </button>
      </nav>

      <div class="recent-block">
        <div class="recent-label">RECENT CHATS</div>
        <div id="recentList" class="recent-list"></div>
      </div>

      <div class="promo">
        <div class="promo-title">CLI still available</div>
        <p>Prefer terminal? Run <code>python -m src.main</code></p>
        <a href="#chatInput">Start coding →</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="model-pill" type="button" title="Model from .env / request">
          CodeAgent · DeepSeek
          <span class="chev">▾</span>
        </button>
        <div class="topbar-right">
          <div id="runStatus" class="run-status idle">Idle</div>
          <div class="user">
            <div class="avatar">CA</div>
            <div class="user-meta">
              <div class="user-name">Local Runner</div>
              <div class="user-mail">sandbox · workdir editable</div>
            </div>
          </div>
        </div>
      </header>

      <div class="workspace">
        <div class="workspace-main">
          <section id="homeView" class="home">
            <h1 class="hello">Hello <span class="grad">Coder</span></h1>
            <p class="subtitle">How can I help you today?</p>
            <div class="cards" id="suggestionCards"></div>
          </section>

          <section id="chatView" class="chat hidden">
            <div id="timeline" class="timeline"></div>
          </section>
        </div>

        <aside id="todoPanel" class="todo-panel hidden">
          <div class="todo-panel-title">Plan</div>
          <div id="todoList" class="todo-list"></div>
        </aside>
      </div>

      <footer class="composer-wrap">
        <div class="workdir-row">
          <label>
            Workdir
            <input id="workdirInput" type="text" value="demos" />
          </label>
          <label>
            Max steps
            <input id="maxStepsInput" type="number" min="1" max="60" value="20" />
          </label>
        </div>
        <form id="composer" class="composer">
          <input id="chatInput" type="text" placeholder="Ask something.." autocomplete="off" />
          <button id="sendBtn" class="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4">
              <path d="M12 19V5M12 5l-6 6M12 5l6 6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="foot-note">Local coding agent · structured tool steps · demos in <code>/demos</code></p>
      </footer>
    </main>
  </div>
  <script src="/static/app.js?v=20260829e"></script>
</body>
</html>
